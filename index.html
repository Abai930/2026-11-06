<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Three.js 星空互動展示</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="overlay">
    <p class="eyebrow">THREE.JS · INTERACTIVE SCENE</p>
    <h1>星際漫遊</h1>
    <p class="hint">拖曳旋轉視角，滾動縮放。點擊畫面讓星球躍動。</p>
    <div class="controls"><span class="dot"></span> <span id="status">正在探索宇宙</span></div>
  </main>
  <div id="scene" aria-label="互動式 3D 星球場景"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
