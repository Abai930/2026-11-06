<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Three.js 星空互動展示</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
:root { color-scheme: dark; font-family: 'DM Sans','Noto Sans TC',sans-serif; background:#050814; color:#f4f6ff; }
* { box-sizing:border-box; }
html,body { margin:0; width:100%; height:100%; overflow:hidden; }
body { background: radial-gradient(ellipse at 70% 45%, #151a3a 0%, #090d20 42%, #050814 78%); }
#scene { position:fixed; inset:0; }
#scene canvas { position:absolute; inset:0; z-index:1; display:block; width:100%; height:100%; }
.overlay { position:fixed; z-index:2; left:clamp(24px,8vw,120px); top:50%; transform:translateY(-50%); pointer-events:none; max-width:440px; }
.eyebrow { font-size:11px; letter-spacing:.24em; color:#94a4ff; font-weight:700; }
h1 { font-size:clamp(42px,7vw,86px); line-height:1.05; margin:20px 0; letter-spacing:.06em; text-shadow:0 0 35px #7385ff66; }
.hint { color:#b9c0dc; font-size:15px; line-height:1.8; }
.controls { margin-top:38px; font-size:13px; color:#d0d5ea; display:flex; align-items:center; gap:10px; }
.dot { width:8px; height:8px; border-radius:50%; background:#73e7d2; box-shadow:0 0 14px #73e7d2; }
@media(max-width:600px) { .overlay { top:auto; bottom:8%; transform:none; left:24px; right:24px; } .hint { max-width:320px; } }
  </style>
</head>
<body>
  <main class="overlay">
    <p class="eyebrow">THREE.JS · INTERACTIVE SCENE</p>
    <h1>星際漫遊</h1>
    <p class="hint">拖曳旋轉視角，滾動縮放。點擊畫面讓星球躍動。</p>
    <div class="controls"><span class="dot"></span> <span id="status">正在探索宇宙</span></div>
  </main>
  <div id="scene" aria-label="互動式 3D 星球場景"></div>
  <style>#error { position:fixed; z-index:4; left:50%; bottom:24px; transform:translateX(-50%); max-width:calc(100% - 32px); padding:12px 16px; border:1px solid #ff8a9a66; border-radius:12px; background:#25121def; color:#ffd8df; font:14px/1.5 sans-serif; text-align:center; }</style>
  <div id="error" role="status" aria-live="polite" hidden>3D 星球載入失敗，請確認網路連線，或使用支援 WebGL 的瀏覽器。</div>
  <script type="module">
try {
const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
const { OrbitControls } = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js');

const mount = document.querySelector('#scene');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.4, 8.8);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
mount.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 4.5;
controls.maxDistance = 13;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.AmbientLight(0x8899ff, 0.75));
const keyLight = new THREE.PointLight(0x8e9fff, 42, 30);
keyLight.position.set(-4, 3, 5);
scene.add(keyLight);
const rimLight = new THREE.PointLight(0x38e6d0, 28, 25);
rimLight.position.set(4, -1, -3);
scene.add(rimLight);

const planet = new THREE.Group();
scene.add(planet);
const sphere = new THREE.Mesh(
  new THREE.IcosahedronGeometry(1.65, 6),
  new THREE.MeshStandardMaterial({ color: 0x465be8, roughness: 0.62, metalness: 0.18, emissive: 0x111d62, emissiveIntensity: 0.45, flatShading: false })
);
planet.add(sphere);

// Glowing atmosphere shell
const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(1.78, 64, 64),
  new THREE.MeshBasicMaterial({ color: 0x5e86ff, transparent: true, opacity: 0.12, side: THREE.BackSide })
);
planet.add(atmosphere);

// Delicate orbital rings
const ringMaterial = new THREE.MeshBasicMaterial({ color: 0x90a5ff, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
const ring = new THREE.Mesh(new THREE.RingGeometry(2.25, 2.27, 160), ringMaterial);
ring.rotation.set(1.12, 0.2, 0.12);
planet.add(ring);
const ring2 = new THREE.Mesh(new THREE.RingGeometry(2.55, 2.56, 160), new THREE.MeshBasicMaterial({ color: 0x51dcca, transparent: true, opacity: 0.26, side: THREE.DoubleSide }));
ring2.rotation.copy(ring.rotation);
planet.add(ring2);

// Star field
const starCount = 1800;
const positions = new Float32Array(starCount * 3);
const colors = new Float32Array(starCount * 3);
const colorA = new THREE.Color(0x899fff), colorB = new THREE.Color(0xffffff), colorC = new THREE.Color(0x62e5d3);
for (let i = 0; i < starCount; i++) {
  const radius = 7 + Math.random() * 22;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
  positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
  positions[i * 3 + 2] = radius * Math.cos(phi);
  const c = [colorA, colorB, colorC][Math.floor(Math.random() * 3)];
  colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
}
const starGeometry = new THREE.BufferGeometry();
starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const stars = new THREE.Points(starGeometry, new THREE.PointsMaterial({ size: 0.045, vertexColors: true, transparent: true, opacity: 0.9, sizeAttenuation: true }));
scene.add(stars);

const status = document.querySelector('#status');
let boost = 0;
renderer.domElement.addEventListener('pointerdown', () => { boost = 1; status.textContent = '星球共鳴中 ✦'; });
renderer.domElement.addEventListener('pointerup', () => { status.textContent = '正在探索宇宙'; });
function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  controls.update();
  planet.rotation.y += 0.0018 + boost * 0.012;
  sphere.rotation.x = Math.sin(t * 0.25) * 0.05;
  stars.rotation.y = t * 0.006;
  boost *= 0.94;
  planet.scale.setScalar(1 + Math.sin(t * 1.2) * 0.012 + boost * 0.08);
  renderer.render(scene, camera);
}
animate();

} catch (error) {
 console.error('Three.js scene failed to start:', error);
 document.querySelector('#error').hidden = false;
}
</script>
</body>
</html>
